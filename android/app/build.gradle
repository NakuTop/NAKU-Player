plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// A TV install coexists with the existing phone app and keeps its sender intact.
def nakuDartDefines = (project.findProperty('dart-defines') ?: '').toString()
    .split(',').findAll { !it.isEmpty() }.collect { new String(Base64.decoder.decode(it), 'UTF-8') }
def nakuTvBuild = nakuDartDefines.contains('NAKU_TV=true')

def nakuSigning = new Properties()
def nakuSigningFile = rootProject.file('key.properties')
if (nakuSigningFile.exists()) {
    nakuSigningFile.withInputStream { nakuSigning.load(it) }
}

android {
    namespace "com.example.kazumi"
    compileSdk flutter.compileSdkVersion
    // Use the highest NDK required by the native plugins. Newer NDKs remain
    // backward compatible with plugins that declare an older version.
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId nakuTvBuild ? "com.nakutop.nakuplayer.tv" : "com.nakutop.nakuplayer"
        manifestPlaceholders.nakuAppLabel = nakuTvBuild ? "NAKU TV" : "NAKU Player"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (nakuSigningFile.exists()) {
                storeFile file(nakuSigning['storeFile'])
                storePassword nakuSigning['storePassword']
                keyAlias nakuSigning['keyAlias']
                keyPassword nakuSigning['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // Media3 uses Android MediaCodec/AudioTrack and a real HDR-capable Surface.
    implementation "androidx.media3:media3-exoplayer:1.11.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.11.1"
    implementation "androidx.media3:media3-exoplayer-dash:1.11.1"
    implementation "androidx.media3:media3-ui:1.11.1"
    implementation "androidx.media3:media3-datasource-okhttp:1.11.1"
    implementation "com.github.junrar:junrar:8.1.2"
}

// Flutter 3.47.6 can leave the pub-get (development) registrant in place for an
// APK release, while its Gradle plugin correctly excludes dev-only projects.
// Keep this generated app-local file consistent with the release classpath;
// never change Flutter/plugin caches or add integration tooling to the APK.
tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach { task ->
    if (task.name.toLowerCase().endsWith('releasejavawithjavac')) {
        task.doFirst {
            def metadataFile = rootProject.file('../.flutter-plugins-dependencies')
            def registrant = project.file('src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java')
            if (metadataFile.exists() && registrant.exists()) {
                def metadata = new groovy.json.JsonSlurper().parse(metadataFile)
                def devPlugins = metadata.plugins.android.findAll { it.dev_dependency == true }.collect { it.name.toString() }
                def original = registrant.getText('UTF-8')
                def filtered = original.replaceAll(/(?s)    try \{.*?    \} catch \(Exception e\) \{.*?    \}\r?\n/) { block ->
                    devPlugins.any { name -> block.contains('"Error registering plugin ' + name + ',') } ? '' : block
                }
                if (filtered != original) registrant.setText(filtered, 'UTF-8')
            }
        }
    }
}

// F-droid splits APKs by ABI, and requires different versionCode for each ABI.
// For flutter version X.Y.Z, version code is X0Y0ZA, where A is the ABI code.
// See:
// * https://developer.android.com/build/gradle-tips
// * https://developer.android.com/studio/build/configure-apk-splits
// * https://gitlab.com/fdroid/fdroiddata/-/blob/master/metadata/im.nfc.nfsee.yml
ext.abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86_64": 4]
import com.android.build.OutputFile
android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def abiVersionCode = project.ext.abiCodes.get(output.getFilter(OutputFile.ABI))
        if (abiVersionCode != null) {
            output.versionCodeOverride = variant.versionCode * 10 + abiVersionCode
        }
    }
}
