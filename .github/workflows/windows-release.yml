name: Windows release build
on:
  workflow_dispatch:
  push:
    branches: [codex/macos-3.1.0]
    paths:
      - '.github/workflows/windows-release.yml'
      - 'scripts/build_windows_installer.ps1'
      - 'scripts/prepare_windows_asr.ps1'
      - 'windows/**'
      - 'lib/**'
      - 'test/features/cinema/**'
      - 'pubspec.*'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true
      - uses: msys2/setup-msys2@v2
        id: archive-tools
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-libarchive
      - name: Provide tar with LZMA support for native playback libraries
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.archive-tools.outputs.msys2-location }}
        run: |
          $source = Join-Path $env:MSYS2_LOCATION 'mingw64/bin'
          # Windows CreateProcess searches the Dart executable directory before PATH.
          $tools = Join-Path $env:FLUTTER_ROOT 'bin/cache/dart-sdk/bin'
          New-Item -ItemType Directory -Path $tools -Force | Out-Null
          Copy-Item "$source/bsdtar.exe" "$tools/tar.exe"
          Copy-Item "$source/*.dll" $tools
          $version = & "$tools/tar.exe" --version
          if ($version -notmatch 'liblzma') { throw "tar is missing LZMA support: $version" }
          Write-Output $version
          & "$tools/dart.exe" scripts/check_windows_archive_tool.dart
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Resolve dependencies
        run: flutter pub get
      - name: Shared playback and library regressions
        run: flutter test --no-pub test/features/cinema/windows_playback_policy_test.dart test/features/cinema/cinema_aggregated_search_test.dart test/features/cinema/cinema_library_identity_test.dart test/features/cinema/cinema_multi_source_danmaku_test.dart test/features/cinema/cinema_movie_versions_test.dart test/features/cinema/cinema_offline_danmaku_test.dart test/features/cinema/cinema_source_priority_test.dart test/features/cinema/cinema_playback_candidates_test.dart test/features/cinema/cinema_detail_comparison_test.dart
      - name: Build installer with bundled runtime
        shell: pwsh
        run: ./scripts/build_windows_installer.ps1
      - name: Verify executable version and package portable app
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content pubspec.yaml -Raw), '(?m)^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$')
          $exe = Get-Item build/windows/x64/runner/Release/NAKUPlayer.exe
          $expected = "$($version.Groups[1].Value).$($version.Groups[2].Value)"
          $actual = '{0}.{1}.{2}.{3}' -f $exe.VersionInfo.FileMajorPart,$exe.VersionInfo.FileMinorPart,$exe.VersionInfo.FileBuildPart,$exe.VersionInfo.FilePrivatePart
          if ($actual -ne $expected) { throw "Executable version mismatch: $actual / $expected" }
          $required = @('flutter_windows.dll','data/icudtl.dat','ai-runtime/whisper-server.exe','ai-runtime/ggml-base.bin')
          foreach ($name in $required) { if (!(Test-Path "build/windows/x64/runner/Release/$name")) { throw "Missing runtime $name" } }
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/windows/NAKUPlayer-$($version.Groups[1].Value)-Windows-x64-portable.zip"
          Get-ChildItem dist/windows -File | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding utf8 dist/windows/SHA256SUMS
      - name: Smoke test silent install and application startup
        shell: pwsh
        run: |
          foreach ($name in @('AudioEndpointBuilder','Audiosrv')) {
            Set-Service -Name $name -StartupType Manual
            Start-Service -Name $name
          }
          $setup = Get-ChildItem dist/windows/*-Setup.exe | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'naku-install-smoke'
          $install = Start-Process -FilePath $setup.FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installDir") -Wait -PassThru
          if ($install.ExitCode -notin @(0,3010)) { throw "Installer failed: $($install.ExitCode)" }
          $app = Join-Path $installDir 'NAKUPlayer.exe'
          if (!(Test-Path $app)) { throw 'Installed executable missing' }
          $process = Start-Process -FilePath $app -WorkingDirectory $installDir -PassThru
          try {
            Start-Sleep -Seconds 15
            $process.Refresh()
            if ($process.HasExited) { throw "Application exited during startup: $($process.ExitCode)" }
            Write-Output "Installed application survived startup, PID $($process.Id)"
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: NAKUPlayer-Windows-x64
          path: dist/windows/
          if-no-files-found: error
          retention-days: 14
