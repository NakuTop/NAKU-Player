name: Windows native regression checks
on:
  workflow_dispatch:
  push:
    branches: [codex/macos-3.1.0]
    paths:
      - '.github/workflows/windows-native-checks.yml'
      - 'windows/runner/**'
      - 'windows/tests/**'
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build native regression executables
        shell: pwsh
        run: |
          cmake -S windows/tests -B build/windows-native-tests -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/windows-native-tests --config Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Enable Windows audio service for loopback regression
        shell: pwsh
        run: |
          foreach ($name in @('AudioEndpointBuilder','Audiosrv')) {
            Set-Service -Name $name -StartupType Manual
            Start-Service -Name $name
            Get-Service -Name $name
          }
      - name: Check encrypted credentials, fullscreen and audio policies
        run: ctest --test-dir build/windows-native-tests -C Release --output-on-failure
